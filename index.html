<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Gardening Assistant - Sign Up & Login</title>
    <style>
        :root {
            --primary-green: #2E7D32;
            --dark-green: #1B5E20;
            --light-green: #E8F5E9;
            --background: #F8FBF7;
            --white: #FFFFFF;
            --text-dark: #263238;
            --text-gray: #607D66;
            --success: #43A047;
            --warning: #FB8C00;
            --danger: #E53935;
            --border: #E0E8E0;
            --radius: 12px;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: url('https://images.unsplash.com/photo-1466692476868-aef1dfb1e735?w=1200&q=80') center/cover;
            background-attachment: fixed;
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .login-form-wrapper {
            padding: 50px 40px;
        }

        .login-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .login-brand-icon {
            font-size: 32px;
        }

        .login-brand-text {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark-green);
        }

        .login-form-header {
            margin-bottom: 30px;
            text-align: center;
        }

        .login-form-header h2 {
            font-size: 28px;
            color: var(--dark-green);
            margin-bottom: 8px;
        }

        .login-form-header p {
            color: var(--text-gray);
            font-size: 14px;
        }

        .toggle-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            padding: 4px;
            border-radius: 8px;
        }

        .toggle-btn {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid var(--border);
            background: var(--white);
            color: var(--text-gray);
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.3s ease;
            font-size: 14px;
        }

        .toggle-btn.active {
            background: var(--white);
            color: var(--primary-green);
            border-color: var(--primary-green);
            box-shadow: 0 2px 8px rgba(46, 125, 50, 0.2);
        }

        .toggle-btn:hover {
            color: var(--primary-green);
            border-color: var(--primary-green);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: var(--white);
            transition: 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
        }

        .form-control::placeholder {
            color: var(--text-gray);
        }

        .hidden {
            display: none;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary-green);
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            font-weight: 400;
            font-size: 14px;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 25px;
        }

        .forgot-password a {
            color: var(--primary-green);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .btn {
            display: inline-block;
            padding: 12px 22px;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s ease;
            width: 100%;
            text-align: center;
        }

        .btn-primary {
            background: var(--primary-green);
            color: var(--white);
            margin-top: 10px;
        }

        .btn-primary:hover {
            background: var(--dark-green);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(46, 125, 50, 0.3);
        }

        .login-footer {
            text-align: center;
            margin-top: 25px;
            color: var(--text-gray);
            font-size: 14px;
        }

        .login-footer a {
            color: var(--primary-green);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        .password-strength {
            font-size: 12px;
            margin-top: 5px;
            color: var(--text-gray);
        }

        .password-strength.weak {
            color: var(--danger);
        }

        .password-strength.medium {
            color: var(--warning);
        }

        .password-strength.strong {
            color: var(--success);
        }

        .success-message {
            background: rgba(67, 160, 71, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .login-form-wrapper {
                padding: 40px 25px;
            }

            .login-form-header h2 {
                font-size: 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .btn {
                padding: 11px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-form-wrapper">
            <div class="login-brand">
                <span class="login-brand-icon">🌿</span>
                <span class="login-brand-text">Urban Gardening</span>
            </div>

            <!-- SIGNUP FORM -->
            <div id="signupForm">
                <div class="login-form-header">
                    <h2>Create Account</h2>
                    <p>Join Urban Gardening Assistant today</p>
                </div>

                <form id="signupFormElement" onsubmit="handleSignup(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstname">First Name</label>
                            <input 
                                type="text" 
                                id="firstname" 
                                class="form-control" 
                                placeholder="First name"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="lastname">Last Name</label>
                            <input 
                                type="text" 
                                id="lastname" 
                                class="form-control" 
                                placeholder="Last name"
                                required
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="signupEmail">Email Address</label>
                        <input 
                            type="email" 
                            id="signupEmail" 
                            class="form-control" 
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="signupPhone">Phone Number</label>
                        <input 
                            type="tel" 
                            id="signupPhone" 
                            class="form-control" 
                            placeholder="Enter your phone number"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="signupPassword">Password</label>
                        <input 
                            type="password" 
                            id="signupPassword" 
                            class="form-control" 
                            placeholder="Enter your password"
                            onchange="checkPasswordStrength()"
                            required
                        >
                        <div class="password-strength" id="passwordStrength"></div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            class="form-control" 
                            placeholder="Confirm your password"
                            required
                        >
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="agreeTerms" name="agreeTerms" required>
                        <label for="agreeTerms">I agree to the Terms & Conditions</label>
                    </div>

                    <button type="submit" class="btn btn-primary">Create Account</button>

                    <div class="login-footer">
                        Already have an account? <a onclick="switchToLogin()">Sign in here</a>
                    </div>
                </form>
            </div>

            <!-- LOGIN FORM -->
            <div id="loginForm" class="hidden">
                <div class="success-message" id="successMessage" style="display: none;">
                    ✓ Account created successfully! Now sign in.
                </div>

                <div class="login-form-header">
                    <h2>Welcome Back</h2>
                    <p>Sign in to your Urban Gardening account</p>
                </div>

                <form id="loginFormElement" onsubmit="handleLogin(event)">
                    <div class="toggle-group">
                        <button type="button" class="toggle-btn active" id="emailToggle" onclick="toggleInput('email')">
                            📧 Email
                        </button>
                        <button type="button" class="toggle-btn" id="phoneToggle" onclick="toggleInput('phone')">
                            📱 Phone
                        </button>
                    </div>

                    <div id="emailField" class="form-group">
                        <label for="loginEmail">Email Address</label>
                        <input 
                            type="email" 
                            id="loginEmail" 
                            class="form-control" 
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div id="phoneField" class="form-group hidden">
                        <label for="loginPhone">Phone Number</label>
                        <input 
                            type="tel" 
                            id="loginPhone" 
                            class="form-control" 
                            placeholder="Enter your phone number"
                        >
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input 
                            type="password" 
                            id="loginPassword" 
                            class="form-control" 
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                        <div class="checkbox-group">
                            <input type="checkbox" id="remember" name="remember">
                            <label for="remember">Remember me</label>
                        </div>
                        <div class="forgot-password">
                            <a href="#forgot">Forgot Password?</a>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Sign In</button>

                    <div class="login-footer">
                        Don't have an account? <a onclick="switchToSignup()">Sign up here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Store user data
        let userData = {};

        // Switch to Login Form
        function switchToLogin() {
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('successMessage').style.display = 'block';
            setTimeout(() => {
                document.getElementById('successMessage').style.display = 'none';
            }, 5000);
        }

        // Switch to Signup Form
        function switchToSignup() {
            document.getElementById('signupForm').classList.remove('hidden');
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupFormElement').reset();
        }

        // Handle Signup
        function handleSignup(event) {
            event.preventDefault();

            const firstname = document.getElementById('firstname').value;
            const lastname = document.getElementById('lastname').value;
            const email = document.getElementById('signupEmail').value;
            const phone = document.getElementById('signupPhone').value;
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validate passwords match
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }

            // Store user data
            userData = {
                firstname,
                lastname,
                email,
                phone,
                password
            };

            // Clear form
            document.getElementById('signupFormElement').reset();
            document.getElementById('passwordStrength').textContent = '';

            // Switch to login
            switchToLogin();
        }

        // Handle Login
        function handleLogin(event) {
            event.preventDefault();

            const loginEmail = document.getElementById('loginEmail').value;
            const loginPhone = document.getElementById('loginPhone').value;
            const loginPassword = document.getElementById('loginPassword').value;

            let isValid = false;

            // Check if login with email
            if (document.getElementById('emailField').classList.contains('hidden') === false) {
                if (loginEmail === userData.email && loginPassword === userData.password) {
                    isValid = true;
                }
            }
            // Check if login with phone
            else {
                if (loginPhone === userData.phone && loginPassword === userData.password) {
                    isValid = true;
                }
            }

            if (isValid) {
                alert(`Welcome back, ${userData.firstname}! 🌿`);
                document.getElementById('loginFormElement').reset();
            } else {
                alert('Invalid email/phone or password!');
            }
        }

        // Toggle between Email and Phone login
        function toggleInput(type) {
            const emailField = document.getElementById('emailField');
            const phoneField = document.getElementById('phoneField');
            const emailToggle = document.getElementById('emailToggle');
            const phoneToggle = document.getElementById('phoneToggle');
            const emailInput = document.getElementById('loginEmail');
            const phoneInput = document.getElementById('loginPhone');

            if (type === 'email') {
                emailField.classList.remove('hidden');
                phoneField.classList.add('hidden');
                emailToggle.classList.add('active');
                phoneToggle.classList.remove('active');
                emailInput.setAttribute('required', 'required');
                phoneInput.removeAttribute('required');
            } else {
                emailField.classList.add('hidden');
                phoneField.classList.remove('hidden');
                emailToggle.classList.remove('active');
                phoneToggle.classList.add('active');
                emailInput.removeAttribute('required');
                phoneInput.setAttribute('required', 'required');
            }
        }

        // Check password strength
        function checkPasswordStrength() {
            const password = document.getElementById('signupPassword').value;
            const strength = document.getElementById('passwordStrength');

            if (password.length < 6) {
                strength.textContent = 'Weak password (min 6 characters)';
                strength.className = 'password-strength weak';
            } else if (password.length < 12) {
                strength.textContent = 'Medium strength password';
                strength.className = 'password-strength medium';
            } else {
                strength.textContent = 'Strong password ✓';
                strength.className = 'password-strength strong';
            }
        }
    </script>
</body>
</html>
