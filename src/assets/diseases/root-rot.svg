<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c16"/>
      <stop offset="60%" stop-color="#1b241d"/>
      <stop offset="100%" stop-color="#0f1511"/>
    </linearGradient>

    <!-- Terracotta Pot Gradient -->
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="35%" stop-color="#c2410c"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>

    <!-- Waterlogged Soil Gradient -->
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f2e21"/>
      <stop offset="40%" stop-color="#261b14"/>
      <stop offset="85%" stop-color="#140f0c"/>
      <stop offset="100%" stop-color="#0c1824"/>
    </linearGradient>

    <!-- Decayed Leaf Gradient -->
    <linearGradient id="sickLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="35%" stop-color="#a16207"/>
      <stop offset="70%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#3b220b"/>
    </linearGradient>

    <!-- Yellowing Dying Leaf -->
    <linearGradient id="yellowLeafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Wet Water Droplet Gradient -->
    <radialGradient id="waterDrop" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="90%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>

    <!-- Texture Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle botanical grid lines -->
  <g stroke="#263428" stroke-width="1" opacity="0.35">
    <line x1="50" y1="0" x2="50" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="350" y1="0" x2="350" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="0" y1="100" x2="500" y2="100"/>
    <line x1="0" y1="200" x2="500" y2="200"/>
    <line x1="0" y1="300" x2="500" y2="300"/>
    <line x1="0" y1="400" x2="500" y2="400"/>
  </g>

  <!-- Title & Disease Identification Header -->
  <rect x="24" y="20" width="452" height="42" rx="10" fill="#1e2922" stroke="#dc2626" stroke-width="1.5" filter="url(#glowRed)"/>
  <circle cx="48" cy="41" r="8" fill="#ef4444"/>
  <text x="48" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">!</text>
  <text x="68" y="46" fill="#fecaca" font-family="system-ui, sans-serif" font-size="15" font-weight="800" letter-spacing="0.5">ROOT ROT (PYTHIUM / OVERWATERING)</text>
  <rect x="375" y="27" width="90" height="26" rx="6" fill="#7f1d1d"/>
  <text x="420" y="44" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">CRITICAL</text>

  <!-- Potted Plant Cutaway System -->
  <g filter="url(#cardShadow)">
    <!-- Terracotta Outer Rim -->
    <path d="M 120,240 L 380,240 L 370,265 L 130,265 Z" fill="#9a3412"/>
    <!-- Outer Pot Body -->
    <path d="M 130,265 L 370,265 L 340,430 L 160,430 Z" fill="url(#potGrad)"/>
    <!-- Cutaway Soil Display Window (Inside Pot) -->
    <path d="M 142,272 L 358,272 L 332,420 L 168,420 Z" fill="url(#soilGrad)" stroke="#1c1917" stroke-width="3"/>

    <!-- Water pooling at bottom (Overwatering sign) -->
    <path d="M 168,398 L 332,398 L 330,420 L 170,420 Z" fill="#0284c7" opacity="0.85"/>
    <ellipse cx="250" cy="400" rx="78" ry="8" fill="#38bdf8" opacity="0.6"/>
    <text x="250" y="415" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Saturated Pooled Water</text>
  </g>

  <!-- ROOT SYSTEM ANATOMY (Healthy vs Rotting) -->
  <g>
    <!-- Normal Healthy Upper Roots (Firm & Creamy-White) -->
    <g stroke="#fef08a" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.95">
      <path d="M 250,270 Q 230,290 205,305 Q 190,315 175,320" />
      <path d="M 250,270 Q 270,290 295,305 Q 310,315 325,320" />
      <path d="M 245,280 Q 235,305 220,325" stroke-width="2"/>
      <path d="M 255,280 Q 265,305 280,325" stroke-width="2"/>
    </g>
    <!-- Label: Healthy Upper Roots -->
    <rect x="290" y="295" width="90" height="20" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="335" y="309" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">✓ Firm White Roots</text>

    <!-- Blackened, Slimy, Rotting Roots (Lower & Submerged) -->
    <g stroke="#1c1917" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M 205,305 Q 190,340 180,380 Q 175,395 180,405" stroke="#451a03"/>
      <path d="M 295,305 Q 310,345 315,385 Q 310,400 305,408" stroke="#451a03"/>
      <path d="M 250,270 Q 248,330 245,370 Q 240,395 245,410" stroke="#261b14" stroke-width="6"/>
      <path d="M 220,325 Q 210,360 215,395" stroke="#1c1917" stroke-width="4"/>
      <path d="M 280,325 Q 290,365 285,400" stroke="#1c1917" stroke-width="4"/>
      <path d="M 235,350 Q 225,380 230,405" stroke="#3b1d11" stroke-width="3.5"/>
      <path d="M 265,350 Q 275,380 268,405" stroke="#3b1d11" stroke-width="3.5"/>
    </g>

    <!-- Decayed Slime / Fungal Necrosis Nodules -->
    <circle cx="245" cy="385" r="7" fill="#78350f" opacity="0.9"/>
    <circle cx="215" cy="375" r="6" fill="#451a03"/>
    <circle cx="285" cy="380" r="6.5" fill="#451a03"/>
    <circle cx="185" cy="390" r="5" fill="#78350f"/>
    <circle cx="310" cy="392" r="5.5" fill="#78350f"/>

    <!-- Warning Callout Box for Root Rot -->
    <rect x="70" y="360" width="125" height="42" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" filter="url(#glowRed)"/>
    <text x="132" y="378" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10" font-weight="900" text-anchor="middle">⚠️ Blackened &amp; Mushy</text>
    <text x="132" y="394" fill="#fecaca" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">Foul-smelling decay</text>
  </g>

  <!-- PLANT STEM (Blackening & Softening at Soil Line) -->
  <g>
    <!-- Healthy Green Upper Stem -->
    <path d="M 250,180 Q 248,225 250,250" stroke="#4ade80" stroke-width="16" stroke-linecap="round"/>
    <!-- Blackened, mushy stem base (collar rot) -->
    <path d="M 250,240 Q 250,260 250,275" stroke="#291a0f" stroke-width="19" stroke-linecap="round"/>
    <ellipse cx="250" cy="272" rx="30" ry="8" fill="#1c1917"/>
    <!-- Soft rot alert arrow -->
    <line x1="170" y1="260" x2="225" y2="260" stroke="#f87171" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="160" y="255" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="end">Mushy Stem Collar</text>
  </g>

  <!-- FOLIAGE SYMPTOMS (Drooping, Wilted, Yellowed Leaves) -->
  <g filter="url(#cardShadow)">
    <!-- Left Drooping Wilted Leaf -->
    <path d="M 248,220 C 180,200 110,230 65,290 C 105,295 170,270 245,235 Z" fill="url(#sickLeafGrad)" stroke="#78350f" stroke-width="2"/>
    <path d="M 245,225 Q 160,245 75,288" stroke="#451a03" stroke-width="2" fill="none" opacity="0.8"/>
    <!-- Leaf necrosis patches on left leaf -->
    <ellipse cx="120" cy="268" rx="14" ry="7" fill="#1c1917" opacity="0.75"/>
    <ellipse cx="90" cy="282" rx="8" ry="4" fill="#451a03" opacity="0.8"/>

    <!-- Right Limp Drooping Leaf -->
    <path d="M 252,205 C 325,185 395,215 440,280 C 395,288 330,260 255,220 Z" fill="url(#yellowLeafGrad)" stroke="#78350f" stroke-width="2"/>
    <path d="M 254,210 Q 340,235 430,278" stroke="#451a03" stroke-width="2" fill="none" opacity="0.8"/>
    <!-- Leaf necrosis on right leaf -->
    <ellipse cx="380" cy="255" rx="18" ry="8" fill="#1c1917" opacity="0.75"/>
    <ellipse cx="415" cy="272" rx="10" ry="5" fill="#451a03" opacity="0.8"/>

    <!-- Center Wilting Shoot (Limp Tip) -->
    <path d="M 250,180 C 235,130 200,105 160,125 C 190,155 230,170 250,180 Z" fill="#ca8a04" stroke="#713f12" stroke-width="1.5"/>
    <path d="M 250,180 C 265,130 300,105 340,125 C 310,155 270,170 250,180 Z" fill="#a16207" stroke="#713f12" stroke-width="1.5"/>
    <path d="M 250,180 Q 248,125 240,95 Q 235,80 220,85" stroke="#713f12" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Water Droplets Running Down (Excess Moisture) -->
  <g fill="url(#waterDrop)">
    <circle cx="150" cy="285" r="5"/>
    <circle cx="345" cy="275" r="5.5"/>
    <circle cx="210" cy="245" r="4.5"/>
    <circle cx="280" cy="250" r="4"/>
  </g>

  <!-- Bottom Diagnostic Summary Badge -->
  <g>
    <rect x="24" y="446" width="452" height="38" rx="8" fill="#18201a" stroke="#374151" stroke-width="1"/>
    <text x="250" y="469" fill="#fef08a" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">
      SYMPTOMS: Wilting Leaves Despite Wet Soil + Mushy Stems + Black Decayed Roots
    </text>
  </g>
</svg>
