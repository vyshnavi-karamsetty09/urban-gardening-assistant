<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="healthyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="lushLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#22c55e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#healthyBg)"/>

  <!-- Status Badge -->
  <rect x="20" y="20" width="160" height="32" rx="16" fill="#065f46" opacity="0.9"/>
  <text x="100" y="41" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">100% HEALTHY</text>

  <!-- Big Vibrant Lush Monstera / Tropical Leaf -->
  <g filter="url(#glow)">
    <!-- Main Leaf Body -->
    <path d="M 200,60 C 290,100 340,200 310,290 C 270,350 200,340 180,330 C 140,345 80,320 60,260 C 40,190 90,90 200,60 Z" fill="url(#lushLeaf)"/>

    <!-- Natural Monstera Leaf Fenestrations (perforations) -->
    <ellipse cx="140" cy="180" rx="14" ry="32" fill="#04382a" transform="rotate(-30 140 180)"/>
    <ellipse cx="120" cy="240" rx="12" ry="26" fill="#04382a" transform="rotate(-40 120 240)"/>
    <ellipse cx="260" cy="190" rx="14" ry="34" fill="#04382a" transform="rotate(30 260 190)"/>
    <ellipse cx="270" cy="250" rx="12" ry="24" fill="#04382a" transform="rotate(45 270 250)"/>

    <!-- Central Vein -->
    <path d="M 200,65 Q 195,190 190,340" stroke="#86efac" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9"/>

    <!-- Lateral Side Veins -->
    <g stroke="#86efac" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75">
      <path d="M 198,110 Q 150,130 100,140"/>
      <path d="M 198,110 Q 240,130 280,145"/>
      <path d="M 196,160 Q 140,185 85,200"/>
      <path d="M 196,160 Q 250,185 295,205"/>
      <path d="M 194,220 Q 140,245 80,265"/>
      <path d="M 194,220 Q 250,245 300,270"/>
      <path d="M 192,270 Q 150,290 110,310"/>
      <path d="M 192,270 Q 240,290 270,310"/>
    </g>

    <!-- Glossy Sheen Overlay -->
    <path d="M 200,65 C 250,90 280,150 260,220 C 230,170 210,100 200,65 Z" fill="url(#gloss)"/>

    <!-- Fresh Morning Dewdrops -->
    <circle cx="165" cy="130" r="6" fill="#ecfdf5" opacity="0.85"/>
    <circle cx="163" cy="128" r="2" fill="#ffffff"/>
    <circle cx="235" cy="150" r="8" fill="#ecfdf5" opacity="0.85"/>
    <circle cx="232" cy="147" r="3" fill="#ffffff"/>
    <circle cx="210" cy="260" r="5" fill="#ecfdf5" opacity="0.85"/>
  </g>

  <!-- Title Label -->
  <rect x="40" y="345" width="320" height="38" rx="8" fill="#064e3b" opacity="0.95" stroke="#059669" stroke-width="1.5"/>
  <text x="200" y="369" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">✓ Healthy Foliage - Vibrant &amp; Clear</text>
</svg>

